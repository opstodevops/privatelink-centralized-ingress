AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Per-application ingress stack (owned by the networking team). Deploy once per
  application. Creates a PrivateLink interface endpoint to the application's endpoint
  service, an Application Load Balancer that forwards to the endpoint, and a custom
  resource that registers the endpoint network interface IP addresses as ALB targets.
  Reads /pattern/ingress/* and /pattern/apps/<AppName>/* from Parameter Store.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  AppName:
    Type: String
    Default: app1
    AllowedPattern: '^[a-z][a-z0-9-]{1,19}$'
    Description: Must match the AppName used for the workload stack.
  AllowedCidr:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: >-
      Required when CloudFront is off: the CIDR range allowed to reach the internet-facing ALB
      (for example your public IP as 203.0.113.10/32). Ignored when CloudFront is on.
  CloudFrontPrefixListId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^pl-[0-9a-f]+$'
    Description: >-
      Required when CloudFront is on: ID of the AWS managed prefix list
      com.amazonaws.global.cloudfront.origin-facing in this Region (CloudFormation cannot look it up).
  RegionalWebAclArn:
    Type: String
    Default: ""
    Description: Optional ARN of a REGIONAL AWS WAF web ACL (from waf.yaml in this Region) to attach to the ALB.
  CloudFrontWebAclArn:
    Type: String
    Default: ""
    Description: Optional ARN of a CLOUDFRONT-scope AWS WAF web ACL (from waf.yaml in us-east-1) to attach to the distribution.
  # Values published by ingress-core.yaml
  VpcId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pattern/ingress/vpc-id
  VpcCidr:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pattern/ingress/vpc-cidr
  AlbSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /pattern/ingress/alb-subnet-ids
  EndpointSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /pattern/ingress/endpoint-subnet-ids
  AlbSubnetCidrs:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /pattern/ingress/alb-subnet-cidrs
  CloudFrontEnabled:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pattern/ingress/cloudfront-enabled
  InspectionEnabled:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /pattern/ingress/inspection-enabled

Conditions:
  UseCloudFront: !Equals [!Ref CloudFrontEnabled, "true"]
  UseInspection: !Equals [!Ref InspectionEnabled, "true"]
  HasRegionalWaf: !Not [!Equals [!Ref RegionalWebAclArn, ""]]
  HasCloudFrontWaf: !And
    - !Condition UseCloudFront
    - !Not [!Equals [!Ref CloudFrontWebAclArn, ""]]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Application Load Balancer for ${AppName}
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - UseCloudFront
        - - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            SourcePrefixListId: !Ref CloudFrontPrefixListId
            Description: HTTP from CloudFront
        - - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Ref AllowedCidr
            Description: HTTP from the allowed range
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCidr
          Description: HTTP to the PrivateLink endpoint
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-alb

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub PrivateLink endpoint for ${AppName}
      VpcId: !Ref VpcId
      # Traffic that is steered through a firewall endpoint cannot be matched by security
      # group reference, so with inspection the rule uses the ALB subnet ranges instead.
      SecurityGroupIngress: !If
        - UseInspection
        - - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Select [0, !Ref AlbSubnetCidrs]
            Description: HTTP from the ALB subnet in the first AZ
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Select [1, !Ref AlbSubnetCidrs]
            Description: HTTP from the ALB subnet in the second AZ
        - - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            SourceSecurityGroupId: !Ref AlbSecurityGroup
            Description: HTTP from the ALB only
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-endpoint

  # Consumer side of PrivateLink. Private DNS stays off: the endpoint service has no
  # private DNS name, and the ALB reaches the endpoint by IP address.
  Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref VpcId
      ServiceName: !Sub '{{resolve:ssm:/pattern/apps/${AppName}/endpoint-service-name}}'
      SubnetIds: !Ref EndpointSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      PrivateDnsEnabled: false
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-endpoint

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: !If [UseCloudFront, internal, internet-facing]
      Subnets: !Ref AlbSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-alb

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      # With the firewall, an ALB node must only use endpoints in its own AZ so the request
      # and the response cross the same firewall endpoint.
      TargetGroupAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: !If [UseInspection, "false", use_load_balancer_configuration]
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-tg

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # An ALB cannot target a VPC endpoint directly, so a custom resource looks up the
  # endpoint network interface IP addresses and registers them as IP targets.
  RegistrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  RegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: register-endpoint-ips
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                Resource: !Ref AlbTargetGroup
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RegistrationLogGroup.Arn

  RegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt RegistrationRole.Arn
      LoggingConfig:
        LogGroup: !Ref RegistrationLogGroup
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          ec2 = boto3.client("ec2")
          elb = boto3.client("elbv2")

          def handler(event, context):
              status, data = cfnresponse.SUCCESS, {}
              try:
                  if event["RequestType"] != "Delete":
                      props = event["ResourceProperties"]
                      tg = props["TargetGroupArn"]
                      enis = ec2.describe_network_interfaces(
                          NetworkInterfaceIds=props["NetworkInterfaceIds"])["NetworkInterfaces"]
                      wanted = {e["PrivateIpAddress"] for e in enis}
                      current = {t["Target"]["Id"] for t in
                                 elb.describe_target_health(TargetGroupArn=tg)["TargetHealthDescriptions"]}
                      if wanted - current:
                          elb.register_targets(TargetGroupArn=tg,
                                               Targets=[{"Id": ip, "Port": 80} for ip in wanted - current])
                      if current - wanted:
                          elb.deregister_targets(TargetGroupArn=tg,
                                                 Targets=[{"Id": ip, "Port": 80} for ip in current - wanted])
                      data["Ips"] = ",".join(sorted(wanted))
              except Exception as exc:  # always answer CloudFormation, or the stack waits an hour
                  print(exc)
                  status, data = cfnresponse.FAILED, {"Error": str(exc)}
              cfnresponse.send(event, context, status, data, event.get("PhysicalResourceId"))

  RegisterEndpointIps:
    Type: Custom::RegisterEndpointIps
    DependsOn: AlbListener
    Properties:
      ServiceToken: !GetAtt RegistrationFunction.Arn
      TargetGroupArn: !Ref AlbTargetGroup
      NetworkInterfaceIds: !GetAtt Endpoint.NetworkInterfaceIds

  RegionalWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasRegionalWaf
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !Ref RegionalWebAclArn

  # ---------------------------------------------------------------------------
  # Optional: CloudFront with a VPC origin. The ALB is internal and CloudFront reaches
  # it through service-managed network interfaces in the ALB subnets.
  # ---------------------------------------------------------------------------
  VpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Condition: UseCloudFront
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub ${AWS::StackName}-origin
        Arn: !Ref Alb
        HTTPPort: 80
        HTTPSPort: 443
        # The default ALB DNS name cannot carry a certificate. For production, use a custom
        # domain with an ACM certificate on the ALB and switch this to https-only.
        OriginProtocolPolicy: http-only

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    DependsOn: AlbListener
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Ingress for ${AppName}
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        WebACLId: !If [HasCloudFrontWaf, !Ref CloudFrontWebAclArn, !Ref AWS::NoValue]
        # Development setting: the default *.cloudfront.net certificate. Use your own
        # domain and an ACM certificate (us-east-1) to require TLS 1.2 or later.
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            VpcOriginConfig:
              VpcOriginId: !Ref VpcOrigin
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          # Managed policies: CachingDisabled, AllViewerExceptHostHeader, SecurityHeadersPolicy
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  Url:
    Value: !If
      - UseCloudFront
      - !Sub https://${Distribution.DomainName}/
      - !Sub http://${Alb.DNSName}/
  RegisteredEndpointIps:
    Value: !GetAtt RegisterEndpointIps.Ips
